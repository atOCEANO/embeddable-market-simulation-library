[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "emsl"
description = "Embeddable market simulation library: a Rust-core crypto market simulator for reinforcement learning, backtests, and parameter sweeps."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dinis Martinho" }]
dynamic = ["version"]
dependencies = [
    "numpy>=1.21",
    "gymnasium>=0.28,<2.0",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
data = ["pandas", "pyarrow"]
tune = ["optuna>=3.0", "cloudpickle>=2.0"]

[project.urls]
Repository = "https://github.com/atOCEANO/embeddable-market-simulation-library"

[tool.maturin]
manifest-path = "crates/emsl-py/Cargo.toml"
python-source = "python"
module-name = "emsl._emsl"
features = ["pyo3/extension-module"]
