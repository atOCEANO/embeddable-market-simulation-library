[package]
name = "emsl-py"
description = "PyO3 bindings for the emsl bar-level market simulator, compiled to the emsl._emsl extension module."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_emsl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py39", "extension-module"] }
numpy = { workspace = true }
emsl-core = { path = "../emsl-core" }
bar-engine = { path = "../bar-engine" }
