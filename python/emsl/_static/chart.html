<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__CSS__</style>
</head>
<body>

<div class="head" id="head" hidden>
  <span id="title"></span>
  <span id="stats"></span>
</div>

<div id="frame">
  <div id="plot">
    <div id="chart"></div>
    <div id="paneCtls"></div>
  </div>
  <div class="footer" id="tools">
    <button id="fit" title="Fit all bars">FIT</button>
    <button id="tbl" aria-pressed="false" title="Trade log">TABLE</button>
    <span class="grow"></span>
    <span class="hint" id="hint"></span>
    <!-- last, and across the gap, because it is not a third of the same thing.
         FIT does something once and TABLE holds a state, and both say what they
         do to the chart. This one names the mode it will switch TO rather than
         the one it is in, which is why it never looks pressed and never could,
         and it changes the whole document rather than the plot. Moved in the
         markup rather than with order:, so the tab order still matches what a
         reader sees -->
    <button id="theme" title="Toggle theme">LIGHT</button>
  </div>
</div>

<div id="tablePanel" hidden>
  <table id="trades">
    <thead><tr>
      <!-- Opened and Closed rather than Entry bar and Exit bar: those two now
           carry a timestamp, and Entry and Exit four columns along are prices -->
      <th>#</th><th>Side</th><th>Opened</th><th>Closed</th><th>Size</th>
      <th>Entry</th><th>Exit</th><th>Fees</th><th>Net PnL</th><th>Bars</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <!-- whatever the caller put under the chart, below the fills rather than in a
       panel of its own: both tables answer the question of what is under this
       chart, so they share the one button (ADR 0113) -->
  <table id="notes" hidden>
    <thead><tr id="nhead"></tr></thead>
    <tbody id="nbody"></tbody>
  </table>
</div>

<script>__LIBRARY__</script>
<script>
(function () {
__BUNDLE__
mount(__SPEC__, document.getElementById("chart"));
})();
</script>
</body>
</html>
