# Release: build the abi3 wheels and the sdist, then publish them as a GitHub
# Release with the artifacts attached. One abi3 wheel per platform covers Python
# 3.9 and up, so the five below cover the common targets without a per-version
# matrix.
#
# A v* tag builds AND releases. A manual dispatch builds only, so the whole
# matrix can be dry-run before committing to a tag:
#   Actions -> release -> Run workflow

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.runner }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
            best_effort: true # cross-compiled, so it may not resolve
          # one fat wheel covering Intel and Apple silicon, built on the runner
          # that exists; the Intel-only macos-13 label is being retired, and a job
          # asking for a retired label queues forever rather than failing
          - runner: macos-latest
            target: universal2-apple-darwin
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pyo3 needs a >=3.9 interpreter to build
      - uses: dtolnay/rust-toolchain@1.88.0
      # The first attempt never fails the job, so the retry below always gets to
      # run; the retry is the one that decides.
      - name: build abi3 wheel
        id: build
        continue-on-error: true
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      # The manylinux legs build inside a container that fetches its toolchain over
      # the network, and a failed fetch exits 35, curl's SSL error, with nothing
      # built. Since `release` needs every wheel, one flake blocked an entire
      # release while the other four artifacts sat there fine. Try once more before
      # giving up; a real compile error fails both attempts just as fast. The
      # cross-compiled leg stays best effort and cannot sink the release either way.
      - name: retry the wheel once
        if: steps.build.outcome == 'failure'
        continue-on-error: ${{ matrix.best_effort || false }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: ignore # a best-effort leg may have produced nothing

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: publish the release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # a dispatch builds only, never releases
    permissions:
      contents: write # creating a release writes to the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            `emsl` is a bar-level crypto market simulator: a Rust core with a small
            Python surface. One engine drives a single backtest, a parameter search,
            and a batched reinforcement-learning rollout, so all three see the same
            fill model and the same costs.

            ## Install

            Wheels are attached below, one per platform, each covering Python 3.9 and
            up. No compiler is needed, and pip picks the one matching your machine:

            ```bash
            pip install --find-links https://github.com/atOCEANO/embeddable-market-simulation-library/releases/expanded_assets/${{ github.ref_name }} emsl
            ```

            The optional extras stack the same way, `"emsl[tune,sb3]"`. Or take a wheel
            from the Assets below and install that file directly.

            Building from source instead needs the [Rust toolchain](https://rustup.rs):

            ```bash
            pip install "git+https://github.com/atOCEANO/embeddable-market-simulation-library.git@${{ github.ref_name }}"
            ```

            ## What is in it

            - An event-driven bar engine: market, limit, and stop orders, with
              reduce-only, post-only, and time-in-force, over a netted spot or perp
              position.
            - Honest costs: maker and taker fees, perp funding, slippage, market
              impact, and a per-order volume cap.
            - No same-bar lookahead: an order decided on bar `t` resolves against
              bar `t+1`, never the bar the decision saw.
            - A backtester returning the stats, the equity curve, and a trade log.
            - `emsl.tune`: parameter search over any `Strategy`, across worker
              processes, on a stats key or an objective of your own.
            - `emsl.rl.VectorEnv`: a Gymnasium vector env, thousands of envs stepped
              in parallel with the GIL released.
            - `emsl.sb3.EmslVecEnv`: a Stable-Baselines3 adapter.

            ## Scope

            Bar-level and approximate by design. It does not model the order book
            (L2), latency, or queue position, and it places no live orders. At bar
            granularity the fill model cannot see the intrabar path, so it can be
            slightly more generous than a live book would be; the costs it charges
            are the real ones.

            ## Verified

            - Rust: 186 tests (64 `emsl-core`, 122 `bar-engine`), rustfmt and clippy
              clean.
            - Python: the one abi3 wheel imported and tested on 3.9, 3.11, and 3.12.
            - Integration: Stable-Baselines3 PPO, A2C, DQN, and SAC, plus VecMonitor,
              VecNormalize, and evaluate_policy, and gymnasium 1.0 through 1.3.

            ## A note on the version

            The public API is not frozen before 1.0. `0.2.0` tightened input
            validation, so the boundary rejects arguments 0.1.0 accepted: non-finite
            configuration scalars, a negative slippage or impact, a fee rate at or
            below -1, a `max_open_orders` outside 1 to 4096, a zero observation
            window, a non-finite limit price or stop trigger, and a non-positive
            `periods_per_year`.

            `0.3.0` finishes the accounting it started. A trade row now carries its
            whole round-trip fee rather than the closing side alone, and a `net_pnl`
            field, so `win_rate`, `profit_factor` and `avg_trade_pct` are net of the
            real cost and reproduce from the trade log; on a run that ends flat the
            net PnL of the logged trades equals the change in equity. New:
            `Engine.replace` for moving a resting order without ever arming a second,
            `is_bust()` and `num_fills()`, and a `min_trades` floor for `tune`.
            Removed: the `OrderStatus` enum, whose `Filled` and `Canceled` variants
            were unconstructible.

            `0.3.1` fixes one real defect in 0.3.0, found by differential testing
            against independent implementations of the decision record: adding to a
            position counted its entry fee twice, so a trade that scaled in reported
            more cost than it paid and its net PnL, win rate, profit factor and
            average trade all read too low. A single entry and exit was never
            affected. If you hold trade statistics from 0.3.0 for a strategy that
            scales in, re-run them. Requires Python 3.9 or newer.
