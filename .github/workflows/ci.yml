# Continuous integration: the same two loops used locally. The pure-Rust crates
# are tested, formatted, and linted; the one abi3 wheel is built once and imported
# and tested across the Python version matrix. Draft: wire the repository up before
# relying on it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pyo3 needs a >=3.9 interpreter to build emsl-py
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo test --locked -p emsl-core -p bar-engine
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build-wheel:
    name: build abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: pip install maturin
      - run: maturin build --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  test-wheel:
    name: test wheel on Python ${{ matrix.python-version }}
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: pip install dist/*.whl numpy gymnasium pandas pyarrow pytest
      - run: python -c "import emsl; print(emsl.__version__)"
      - run: pytest -q tests
