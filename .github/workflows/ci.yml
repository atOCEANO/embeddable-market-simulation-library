# Continuous integration: the same two loops used locally. The pure-Rust crates
# are tested, formatted, and linted; the one abi3 wheel is built once and imported
# and tested across the Python version matrix, installing from dev/constraints.txt
# as the Docker gate does. The differential, browser, SB3 and sdist checks run as
# the same Docker stages they are locally, and the changed Rust lines get mutation
# testing against the commit before.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11" # pyo3 needs a >=3.9 interpreter to build emsl-py
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo test --locked -p emsl-core -p bar-engine
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build-wheel:
    name: build abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: pip install -c dev/constraints.txt maturin
      - run: maturin build --release --locked --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/*.whl

  test-wheel:
    name: test wheel on Python ${{ matrix.python-version }}
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel
          path: dist
      - run: |
          pip install -c dev/constraints.txt dist/*.whl \
            numpy gymnasium pandas pyarrow optuna cloudpickle pytest
      - run: python -c "import emsl; print(emsl.__version__)"
      - run: pytest -q tests

  docker-stages:
    name: differential, browser, SB3 and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target test-differential .
      - run: docker build --target test-browser .
      - run: docker build --target test-sb3 .
      - run: docker build --target test-sdist .

  # The job below compares against the commit before. A new branch or a rewritten
  # history has none in reach, so the diff is empty and nothing is compared.
  mutants:
    name: mutants in the changed Rust lines
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@94ec8bc822f50f94d0e68501cff2eb388c550726 # 1.88.0
      - run: cargo install --locked cargo-mutants --version 27.1.0
      - run: git diff "$BASE" HEAD > changes.diff || true > changes.diff
      - run: |
          cargo mutants --package emsl-core --package bar-engine \
            --in-diff changes.diff --jobs 4
